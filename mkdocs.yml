      - 02. Матриці та LU-розклад: linear-algebra/notes/02-matrices-vectors-and-lu-factorization.md
      - 03. Визначники та Крамер: linear-algebra/notes/03-determinants-and-cramers-rule.md
      - 04. Векторні простори: linear-algebra/notes/04-vector-spaces-subspaces-and-spans.md
      - 05. Базиси та 4 підпростори: linear-algebra/notes/05-bases-dimension-rank-and-four-subspaces.md
      - 06. Заміна базису та оператори: linear-algebra/notes/06-change-of-basis-and-linear-transformations.md
