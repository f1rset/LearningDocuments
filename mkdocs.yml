site_name: Learning Documents
site_description: Репозиторій структурованих конспектів та інженерних шпаргалок
site_url: https://f1rset.github.io/LearningDocuments/
repo_url: https://github.com/f1rset/LearningDocuments
repo_name: f1rset/LearningDocuments

use_directory_urls: false

theme:
  name: material
  language: uk
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Темна тема
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Світла тема
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

docs_dir: docs
site_dir: site

nav:
  - Головна: index.md
  - Лінійна алгебра (Linear Algebra):
      - Головна та зміст: linear-algebra/index.md
      - Шпаргалка (Cheat Sheet): linear-algebra/cheat-sheet.md
      - 01. Системи лінійних рівнянь: linear-algebra/notes/01-systems-of-linear-equations-and-gaussian-elimination.md
      - 02. Матриці та LU-розклад: linear-algebra/notes/02-matrices-vectors-and-lu-factorization.md
      - 03. Визначники та Крамер: linear-algebra/notes/03-determinants-and-cramers-rule.md
      - 04. Векторні простори: linear-algebra/notes/04-vector-spaces-subspaces-and-spans.md
      - 05. Базиси та 4 підпростори: linear-algebra/notes/05-bases-dimension-rank-and-four-subspaces.md
      - 06. Заміна базису та оператори: linear-algebra/notes/06-change-of-basis-and-linear-transformations.md
      - 07. Норми та ортогональність: linear-algebra/notes/07-norms-inner-products-and-orthogonality.md
      - 08. Проекції та МНК: linear-algebra/notes/08-orthonormal-bases-projections-and-least-squares.md
      - 09. Грама-Шмідта та QR: linear-algebra/notes/09-orthogonal-matrices-gram-schmidt-and-qr.md
      - 10. Власні значення та Жордан: linear-algebra/notes/10-eigenvalues-eigenvectors-and-jordan-form.md
      - 11. Симетричні матриці та PCA: linear-algebra/notes/11-symmetric-matrices-quadratic-forms-and-pca.md
      - 12. Спектральна теорія та унітарні матриці: linear-algebra/notes/12-symmetric-unitary-matrices-and-spectral-decomposition.md
      - 13. Сингулярний розклад (SVD): linear-algebra/notes/13-svd-and-best-rank-approximations.md
  - Аналогова схемотехніка:
      - Вступ та зміст: analog-circuit-design/prerequisites/index.md
      - Шпаргалка (Cheat Sheet): analog-circuit-design/prerequisites/cheat-sheet.md
      - 01. Електростатика: analog-circuit-design/prerequisites/01-electrostatics-and-potential.md
      - 02. Струм та опір: analog-circuit-design/prerequisites/02-electric-current-and-resistance.md
      - 03. Робота, потужність, ЕРС: analog-circuit-design/prerequisites/03-work-power-and-emf.md
      - 04. Резистори та подільники: analog-circuit-design/prerequisites/04-resistor-circuits-and-dividers.md
      - 05. Закони Кірхгофа: analog-circuit-design/prerequisites/05-kirchhoff-laws-and-analysis.md
      - 06. Конденсатори та RC: analog-circuit-design/prerequisites/06-capacitors-and-rc-basics.md
      - 07. Індуктивності та RL: analog-circuit-design/prerequisites/07-inductors-and-rl-basics.md
      - 08. Змінний струм та фільтри: analog-circuit-design/prerequisites/08-ac-signals-and-passive-components.md
      - 09. Вимірювання та практика: analog-circuit-design/prerequisites/09-measurements-and-real-world-circuits.md
      - Лекція 1 (Двополюсники, BJT, JFET):
          - Конспект лекції: analog-circuit-design/lectures/l1/index.md
          - Шпаргалка (Cheat Sheet): analog-circuit-design/lectures/l1/cheat-sheet.md
          - Питання та відповіді (Q&A): analog-circuit-design/lectures/l1/questions.md
