name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material & Extensions
        run: |
          pip install --upgrade pip
          pip install mkdocs-material pymdown-extensions

      - name: Prepare documentation directory
        run: |
          mkdir -p docs/analog-circuit-design docs/linear-algebra docs/calculus
          # Копіюємо кореневий README як головну сторінку сайту
          cp README.md docs/index.md
          
          # Копіюємо матеріали курсів
          cp -r analog-circuit-design/* docs/analog-circuit-design/
          cp -r linear-algebra/* docs/linear-algebra/
          cp -r calculus/* docs/calculus/

      - name: Build MkDocs documentation
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
